upstream web_upstream {
  server web:3000;
}

upstream api_upstream {
  server api:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $uri $error_lang {
  ~^/en(/|$) en;
  default zh;
}

# ---------- HTTP server（80）----------
server {
  listen 80;
  listen [::]:80;
  server_name devshare.cfd www.devshare.cfd;

  client_max_body_size 10m;

  # certbot 验证路径（必须）
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 其他请求全部跳转到 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------- HTTPS server（443）----------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name devshare.cfd www.devshare.cfd;

  ssl_certificate /etc/letsencrypt/live/devshare.cfd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/devshare.cfd/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 10m;

  error_page 404 =404 /errors/$error_lang/404.html;
  error_page 502 =502 /errors/$error_lang/5xx.html;
  error_page 503 =503 /errors/$error_lang/5xx.html;
  error_page 504 =504 /errors/$error_lang/5xx.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location /_nuxt/ {
    proxy_pass http://web_upstream;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_intercept_errors on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /errors/ {
    alias /usr/share/nginx/html/errors/;
    add_header Cache-Control "no-cache";
    default_type text/html;
  }
}